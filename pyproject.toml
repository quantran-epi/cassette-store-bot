[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cassette-store"
version = "0.1.0"
description = "Telegram Chatbot for cassette tape shop order management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot~=22.8",
    "aiosqlite~=0.22.1",
    "pydantic~=2.14.1",
    "pydantic-settings~=2.16.1",
    "openai~=3.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
