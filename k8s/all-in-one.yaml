apiVersion: v1
kind: Namespace
metadata:
  name: cassette-store
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bot-config
  namespace: cassette-store
data:
  TZ: "Asia/Ho_Chi_Minh"
  SQLITE_DB_PATH: "/app/data/cassette_store.db"
  NINE_ROUTER_BASE_URL: "https://api.9router.com/v1"
  NINE_ROUTER_MODEL_ID: "gpt-4o-mini"
---
apiVersion: v1
kind: Secret
metadata:
  name: bot-secret
  namespace: cassette-store
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN"
  NINE_ROUTER_API_KEY: "YOUR_9ROUTER_KEY"
  TELEGRAM_WHITELIST_USER_IDS: "123456789"
  TELEGRAM_SUPER_ADMIN_ID: "123456789"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bot-data-pvc
  namespace: cassette-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassette-store-bot
  namespace: cassette-store
  labels:
    app: cassette-store-bot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cassette-store-bot
  template:
    metadata:
      labels:
        app: cassette-store-bot
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: bot
          # Replace with your Docker Hub image: e.g. <username>/cassette-store-bot:latest
          image: cassette-store-bot:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bot-config
            - secretRef:
                name: bot-secret
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - src.scripts.healthcheck
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - src.scripts.healthcheck
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: bot-data-pvc
